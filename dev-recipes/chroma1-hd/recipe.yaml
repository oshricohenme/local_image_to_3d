{
  "schema": 2,
  "id": "chroma1-hd",
  "name": "Chroma1 HD",
  "publisher": "Lodestone",
  "license": "Apache-2.0",
  "homepage": "https://huggingface.co/lodestones/Chroma1-HD",
  "description": "Runs with stable-diffusion.cpp Metal. Model-specific Apple GPU parity remains unverified. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "uv pip install huggingface-hub numpy safetensors torch",
    "cmake -S repo -B repo/build -DSD_METAL=ON -DCMAKE_BUILD_TYPE=Release",
    "cmake --build repo/build --config Release -j 4",
    "repo/build/bin/sd-cli --help"
  ],
  "brew": [
    "cmake",
    "ffmpeg"
  ],
  "metal_toolchain": true,
  "weights": [
    {
      "repo": "lodestones/Chroma1-HD",
      "revision": "0e0c60ece1e82b17cb7f77342d765ba5024c40c0",
      "gated": false,
      "files": [
        "Chroma1-HD.safetensors",
        "vae/diffusion_pytorch_model.safetensors"
      ]
    },
    {
      "repo": "Comfy-Org/stable-diffusion-3.5-fp8",
      "revision": "934251d1e6168bcb45a069abc5bd5cdd5f8fea00",
      "gated": false,
      "files": [
        "text_encoders/t5xxl_fp16.safetensors"
      ]
    }
  ],
  "attribution": {
    "project": "Chroma1 HD",
    "authors": [
      "Lodestone"
    ],
    "homepage": "https://huggingface.co/lodestones/Chroma1-HD",
    "license": {
      "spdx": "Apache-2.0",
      "url": "https://huggingface.co/lodestones/Chroma1-HD"
    },
    "components": [
      {
        "name": "lodestones/Chroma1-HD",
        "role": "model component",
        "url": "https://huggingface.co/lodestones/Chroma1-HD",
        "license": {
          "spdx": "Apache-2.0",
          "url": "https://huggingface.co/lodestones/Chroma1-HD"
        },
        "restrictions": []
      },
      {
        "name": "Comfy-Org/stable-diffusion-3.5-fp8",
        "role": "model component",
        "url": "https://huggingface.co/Comfy-Org/stable-diffusion-3.5-fp8",
        "license": {
          "spdx": "NOASSERTION",
          "url": "https://huggingface.co/Comfy-Org/stable-diffusion-3.5-fp8"
        },
        "restrictions": [
          "review model card terms"
        ]
      },
      {
        "name": "leejet/stable-diffusion.cpp",
        "role": "Mac inference runtime",
        "url": "https://github.com/leejet/stable-diffusion.cpp",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/leejet/stable-diffusion.cpp"
        }
      }
    ]
  },
  "resources": {
    "memory_gb": 48,
    "disk_gb": 60
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_image",
      "modality": "image",
      "label": "Text to image",
      "inputs": [
        {
          "name": "prompt",
          "type": "text"
        }
      ],
      "output": "image",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "width",
          "label": "Width",
          "type": "enum",
          "default": 1024,
          "group": "basic",
          "help": "Width used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "height",
          "label": "Height",
          "type": "enum",
          "default": 1024,
          "group": "basic",
          "help": "Height used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "steps",
          "label": "Steps",
          "type": "int",
          "default": 30,
          "group": "advanced",
          "help": "Steps used by the upstream model.",
          "min": 1,
          "max": 100
        },
        {
          "key": "guidance",
          "label": "Guidance",
          "type": "float",
          "default": 4.0,
          "group": "advanced",
          "help": "Guidance used by the upstream model.",
          "min": 1,
          "max": 20
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/leejet/stable-diffusion.cpp",
  "commit": "1d0a58a35050d285b1d6fb1bc68a92924d35825e",
  "prepare": [
    "python -m lift_media.prepare recipe --expected f34c420932c447ca7218d8578ad8339d72a28633c304ba92ce36ac37844e1d5b"
  ]
}
