{
  "schema": 2,
  "id": "ace-step15",
  "name": "ACE Step 1.5",
  "publisher": "ACE-Step",
  "license": "Apache-2.0",
  "homepage": "https://github.com/sawfwair/mere-run/blob/01feae347b640f1c9fa8bf8e7dfbf782497d2706/docs/model-sources.md",
  "description": "Generate songs from a musical description and lyrics. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "git -C repo lfs install --local",
    "git -C repo lfs pull",
    "cd repo && swift build --configuration release --product mere.run",
    "cd repo && bash scripts/build_mlx_metallib.sh --configuration release"
  ],
  "brew": [
    "git-lfs",
    "ffmpeg"
  ],
  "metal_toolchain": true,
  "weights": [],
  "attribution": {
    "project": "ACE Step 1.5",
    "authors": [
      "ACE-Step"
    ],
    "homepage": "https://github.com/sawfwair/mere-run/blob/01feae347b640f1c9fa8bf8e7dfbf782497d2706/docs/model-sources.md",
    "license": {
      "spdx": "Apache-2.0",
      "url": "https://github.com/sawfwair/mere-run/blob/01feae347b640f1c9fa8bf8e7dfbf782497d2706/docs/model-sources.md"
    },
    "components": [
      {
        "name": "sawfwair/mere-run",
        "role": "Mac inference runtime",
        "url": "https://github.com/sawfwair/mere-run",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/sawfwair/mere-run"
        }
      }
    ]
  },
  "resources": {
    "memory_gb": 32,
    "disk_gb": 110
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "generate_song",
      "modality": "music",
      "label": "Generate song",
      "inputs": [
        {
          "name": "prompt",
          "type": "text"
        },
        {
          "name": "lyrics",
          "type": "text"
        }
      ],
      "output": "audio",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "duration",
          "label": "Duration",
          "type": "int",
          "default": 30,
          "group": "basic",
          "help": "Duration used by the upstream model.",
          "min": 5,
          "max": 360
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    },
    {
      "id": "cover_song",
      "modality": "music",
      "label": "Cover song",
      "inputs": [
        {
          "name": "audio",
          "type": "audio"
        },
        {
          "name": "prompt",
          "type": "text"
        },
        {
          "name": "lyrics",
          "type": "text"
        }
      ],
      "output": "audio",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "duration",
          "label": "Duration",
          "type": "int",
          "default": 30,
          "group": "basic",
          "help": "Duration used by the upstream model.",
          "min": 5,
          "max": 360
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/sawfwair/mere-run",
  "commit": "01feae347b640f1c9fa8bf8e7dfbf782497d2706",
  "prepare": [
    "python -m lift_media.prepare recipe --expected 1ce09a9a29c6282b6e2d1a5ae2151be48b68659c0e4f73c01d08ff8e62617bd9"
  ]
}
