        }
      }
    ]
  },
  "resources": {
    "memory_gb": 4,
    "disk_gb": 20
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_speech",
      "modality": "audio",
      "label": "Text to speech",
      "inputs": [
        {
          "name": "text",
          "type": "text"
        }
      ],
      "output": "audio",
      "entry": "launcher:run",
      "settings": [],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    },
    {
      "id": "voice_clone",
      "modality": "audio",
      "label": "Voice clone",
      "inputs": [
        {
          "name": "reference",
          "type": "audio"
        },
        {
          "name": "text",
          "type": "text"
        },
        {
          "name": "transcript",
          "type": "text"
        }
      ],
      "output": "audio",
      "entry": "launcher:run",
      "settings": [],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/Blaizzy/mlx-audio",
  "commit": "e66ad2ff4eb96ce1149000187b30370cbcd707aa",
  "prepare": [
    "python -m lift_media.prepare recipe --expected b333679b4e8000a916287ec704945c5c3d9d9369bba52daa57e4444563352c58"
  ]
}
