{
  "schema": 2,
  "id": "moss-tts-nano",
  "name": "MOSS TTS Nano",
  "publisher": "OpenMOSS",
  "license": "Apache-2.0",
  "homepage": "https://huggingface.co/mlx-community/MOSS-TTS-Nano-100M",
  "description": "Local speech synthesis and reference voice conditioning. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "uv pip install \"./repo[tts,sts]\" soundfile"
  ],
  "brew": [],
