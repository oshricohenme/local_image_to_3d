{
  "schema": 2,
  "id": "minit2i",
  "name": "MiniT2I B16",
  "publisher": "MiniT2I",
  "license": "MIT",
  "homepage": "https://huggingface.co/MiniT2I/MiniT2I",
  "description": "Runs with stable-diffusion.cpp Metal. Model-specific Apple GPU parity remains unverified. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "uv pip install huggingface-hub numpy safetensors torch",
    "cmake -S repo -B repo/build -DSD_METAL=ON -DCMAKE_BUILD_TYPE=Release",
    "cmake --build repo/build --config Release -j 4",
    "repo/build/bin/sd-cli --help"
  ],
  "brew": [
    "cmake",
    "ffmpeg"
  ],
  "metal_toolchain": true,
  "weights": [
    {
      "repo": "MiniT2I/MiniT2I",
      "revision": "5b4da2870d1554992670d1005567e9d55b1b37bb",
      "gated": false,
      "files": [
        "minit2i-b-16/transformer/diffusion_pytorch_model.safetensors"
      ]
    },
    {
      "repo": "google/flan-t5-large",
      "revision": "0613663d0d48ea86ba8cb3d7a44f0f65dc596a2a",
      "gated": false,
      "files": [
        "model.safetensors"
      ]
    }
  ],
  "attribution": {
    "project": "MiniT2I B16",
    "authors": [
      "MiniT2I"
    ],
    "homepage": "https://huggingface.co/MiniT2I/MiniT2I",
    "license": {
      "spdx": "MIT",
      "url": "https://huggingface.co/MiniT2I/MiniT2I"
    },
    "components": [
      {
        "name": "MiniT2I/MiniT2I",
        "role": "model component",
        "url": "https://huggingface.co/MiniT2I/MiniT2I",
        "license": {
          "spdx": "MIT",
          "url": "https://huggingface.co/MiniT2I/MiniT2I"
        },
        "restrictions": []
      },
      {
        "name": "google/flan-t5-large",
        "role": "model component",
        "url": "https://huggingface.co/google/flan-t5-large",
        "license": {
          "spdx": "Apache-2.0",
          "url": "https://huggingface.co/google/flan-t5-large"
        },
        "restrictions": []
      },
      {
        "name": "leejet/stable-diffusion.cpp",
        "role": "Mac inference runtime",
        "url": "https://github.com/leejet/stable-diffusion.cpp",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/leejet/stable-diffusion.cpp"
        }
      }
    ]
  },
  "resources": {
    "memory_gb": 8,
    "disk_gb": 10
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_image",
      "modality": "image",
      "label": "Text to image",
      "inputs": [
        {
          "name": "prompt",
          "type": "text"
        }
      ],
      "output": "image",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "width",
          "label": "Width",
          "type": "enum",
          "default": 512,
          "group": "basic",
          "help": "Width used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "height",
          "label": "Height",
          "type": "enum",
          "default": 512,
          "group": "basic",
          "help": "Height used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "steps",
          "label": "Steps",
          "type": "int",
          "default": 100,
          "group": "advanced",
          "help": "Steps used by the upstream model.",
          "min": 1,
          "max": 100
        },
        {
          "key": "guidance",
          "label": "Guidance",
          "type": "float",
          "default": 6.0,
          "group": "advanced",
          "help": "Guidance used by the upstream model.",
          "min": 1,
          "max": 20
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/leejet/stable-diffusion.cpp",
  "commit": "1d0a58a35050d285b1d6fb1bc68a92924d35825e",
  "prepare": [
    "python -m lift_media.prepare recipe --expected 1e9d5a856860f5985283c2e82d752987789cbc7d729d0ea81ca5d71268fbfe6e"
  ]
}
