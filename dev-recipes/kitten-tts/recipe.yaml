{
  "schema": 2,
  "id": "kitten-tts",
  "name": "KittenTTS Mini",
  "publisher": "KittenML",
  "license": "Apache-2.0",
  "homepage": "https://huggingface.co/mlx-community/kitten-tts-mini-0.8",
  "description": "Local speech synthesis. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "uv pip install \"./repo[tts,sts]\" soundfile",
    "uv pip install phonemizer-fork"
  ],
  "brew": [
    "espeak-ng"
  ],
  "metal_toolchain": false,
  "weights": [
    {
      "repo": "mlx-community/kitten-tts-mini-0.8",
      "revision": "a22cce835c4af60bf9a50779124cf8cc34b0c36e",
      "gated": false
    }
  ],
  "attribution": {
    "project": "KittenTTS Mini",
    "authors": [
      "KittenML"
    ],
    "homepage": "https://huggingface.co/mlx-community/kitten-tts-mini-0.8",
    "license": {
      "spdx": "Apache-2.0",
      "url": "https://huggingface.co/mlx-community/kitten-tts-mini-0.8"
    },
    "components": [
      {
        "name": "mlx-community/kitten-tts-mini-0.8",
        "role": "model component",
        "url": "https://huggingface.co/mlx-community/kitten-tts-mini-0.8",
        "license": {
          "spdx": "Apache-2.0",
          "url": "https://huggingface.co/mlx-community/kitten-tts-mini-0.8"
        },
        "restrictions": []
      },
      {
        "name": "Blaizzy/mlx-audio",
        "role": "Mac inference runtime",
        "url": "https://github.com/Blaizzy/mlx-audio",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/Blaizzy/mlx-audio"
        }
      }
    ]
  },
  "resources": {
    "memory_gb": 2,
    "disk_gb": 20
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_speech",
      "modality": "audio",
      "label": "Text to speech",
      "inputs": [
        {
          "name": "text",
          "type": "text"
        }
      ],
      "output": "audio",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "voice",
          "label": "Voice",
          "type": "string",
          "default": "Jasper",
          "group": "basic",
          "help": "Voice used by the upstream model."
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/Blaizzy/mlx-audio",
  "commit": "e66ad2ff4eb96ce1149000187b30370cbcd707aa",
  "prepare": [
    "python -m lift_media.prepare recipe --expected 123ce9a1bfdf8e6c72fd9deb75c464cff51300cb6f6a1bd5aaab5b80a4212de4"
  ]
}
