{
  "schema": 2,
  "id": "ideogram4",
  "name": "Ideogram 4",
  "publisher": "Ideogram",
  "license": "LicenseRef-Ideogram-NonCommercial",
  "homepage": "https://huggingface.co/ideogram-ai/ideogram-4-fp8",
  "description": "Create 2D images locally with MLX. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "uv pip install ./repo"
  ],
  "brew": [],
  "metal_toolchain": false,
  "weights": [
    {
      "repo": "ideogram-ai/ideogram-4-fp8",
      "revision": "ee79a7237b519f1402ceacf952f30c8a31ec5073",
      "gated": true
    }
  ],
  "attribution": {
    "project": "Ideogram 4",
    "authors": [
      "Ideogram"
    ],
    "homepage": "https://huggingface.co/ideogram-ai/ideogram-4-fp8",
    "license": {
      "spdx": "LicenseRef-Ideogram-NonCommercial",
      "url": "https://huggingface.co/ideogram-ai/ideogram-4-fp8"
    },
    "components": [
      {
        "name": "ideogram-ai/ideogram-4-fp8",
        "role": "model component",
        "url": "https://huggingface.co/ideogram-ai/ideogram-4-fp8",
        "license": {
          "spdx": "NOASSERTION",
          "url": "https://huggingface.co/ideogram-ai/ideogram-4-fp8"
        },
        "restrictions": [
          "review model card terms"
        ]
      },
      {
        "name": "mflux-community/mflux",
        "role": "Mac inference runtime",
        "url": "https://github.com/mflux-community/mflux",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/mflux-community/mflux"
        }
      },
      {
        "name": "Ideogram 4 usage terms",
        "role": "model use",
        "url": "https://huggingface.co/ideogram-ai/ideogram-4-fp8",
        "license": {
          "spdx": "LicenseRef-Ideogram-NonCommercial",
          "url": "https://huggingface.co/ideogram-ai/ideogram-4-fp8"
        },
        "restrictions": [
          "custom terms; review before use"
        ]
      }
    ]
  },
  "resources": {
    "memory_gb": 24,
    "disk_gb": 100
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_image",
      "modality": "image",
      "label": "Text to image",
      "inputs": [
        {
          "name": "prompt",
          "type": "text"
        }
      ],
      "output": "image",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "width",
          "label": "Width",
          "type": "enum",
          "default": 512,
          "group": "basic",
          "help": "Width used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "height",
          "label": "Height",
          "type": "enum",
          "default": 512,
          "group": "basic",
          "help": "Height used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        },
        {
          "key": "preset",
          "label": "Preset",
          "type": "enum",
          "default": "V4_DEFAULT_20",
          "group": "advanced",
          "help": "Preset used by the upstream model.",
          "options": [
            "V4_DEFAULT_20",
            "V4_QUALITY_48",
            "V4_TURBO_12"
          ]
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/mflux-community/mflux",
  "commit": "602b26d242eb7ea9df2a765162a7f35c45c7a143",
  "prepare": [
    "python -m lift_media.prepare recipe --expected 24ea56dd347d8c7a7a75585124d7f110ad3c9b693155a41d3fe05e306294e417"
  ]
}
