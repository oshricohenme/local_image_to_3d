{
  "schema": 2,
  "id": "fibo",
  "name": "FIBO",
  "publisher": "BRIA",
  "license": "LicenseRef-BRIA-FIBO",
  "homepage": "https://huggingface.co/briaai/FIBO",
  "description": "Create 2D images locally with MLX. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "uv pip install ./repo"
  ],
  "brew": [],
  "metal_toolchain": false,
  "weights": [
    {
      "repo": "briaai/FIBO",
      "revision": "7c7e00ca081f6cd24bbbd745d13cc214484c9199",
      "gated": true
    },
    {
      "repo": "briaai/FIBO-vlm",
      "revision": "bd13da5e0b73c808014d6260963e311c8cdf0d8b",
      "gated": false
    }
  ],
  "attribution": {
    "project": "FIBO",
    "authors": [
      "BRIA"
    ],
    "homepage": "https://huggingface.co/briaai/FIBO",
    "license": {
      "spdx": "LicenseRef-BRIA-FIBO",
      "url": "https://huggingface.co/briaai/FIBO"
    },
    "components": [
      {
        "name": "briaai/FIBO",
        "role": "model component",
        "url": "https://huggingface.co/briaai/FIBO",
        "license": {
          "spdx": "NOASSERTION",
          "url": "https://huggingface.co/briaai/FIBO"
        },
        "restrictions": [
          "review model card terms"
        ]
      },
      {
        "name": "mflux-community/mflux",
        "role": "Mac inference runtime",
        "url": "https://github.com/mflux-community/mflux",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/mflux-community/mflux"
        }
      },
      {
        "name": "FIBO usage terms",
        "role": "model use",
        "url": "https://huggingface.co/briaai/FIBO",
        "license": {
          "spdx": "LicenseRef-BRIA-FIBO",
          "url": "https://huggingface.co/briaai/FIBO"
        },
        "restrictions": [
          "custom terms; review before use"
        ]
      },
      {
        "name": "briaai/FIBO-vlm",
        "role": "model component",
        "url": "https://huggingface.co/briaai/FIBO-vlm",
        "license": {
          "spdx": "NOASSERTION",
          "url": "https://huggingface.co/briaai/FIBO-vlm"
        },
        "restrictions": [
          "review model card terms"
        ]
      }
    ]
  },
  "resources": {
    "memory_gb": 24,
    "disk_gb": 140
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_image",
      "modality": "image",
      "label": "Text to image",
      "inputs": [
        {
          "name": "prompt",
          "type": "text"
        }
      ],
      "output": "image",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "width",
          "label": "Width",
          "type": "enum",
          "default": 512,
          "group": "basic",
          "help": "Width used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "height",
          "label": "Height",
          "type": "enum",
          "default": 512,
          "group": "basic",
          "help": "Height used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        },
        {
          "key": "steps",
          "label": "Steps",
          "type": "int",
          "default": 30,
          "group": "advanced",
          "help": "Steps used by the upstream model.",
          "min": 1,
          "max": 100
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/mflux-community/mflux",
  "commit": "602b26d242eb7ea9df2a765162a7f35c45c7a143",
  "prepare": [
    "python -m lift_media.prepare recipe --expected 19fcc9b9e633d0e1ed9c2ac6727ac55a919392e6f35e01190212a2fbdd00bec3"
  ]
}
