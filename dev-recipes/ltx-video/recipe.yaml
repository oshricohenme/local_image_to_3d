{
  "schema": 2,
  "id": "ltx-video",
  "name": "LTX 2.3 Video",
  "publisher": "Lightricks",
  "license": "LicenseRef-LTX",
  "homepage": "https://github.com/sawfwair/mere-run/blob/01feae347b640f1c9fa8bf8e7dfbf782497d2706/docs/model-sources.md",
  "description": "Generate video from text or a starting image with the native LTX 2.3 runtime. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "git -C repo lfs install --local",
    "git -C repo lfs pull",
    "cd repo && swift build --configuration release --product mere.run",
    "cd repo && bash scripts/build_mlx_metallib.sh --configuration release"
  ],
  "brew": [
    "git-lfs",
    "ffmpeg"
  ],
  "metal_toolchain": true,
  "weights": [],
  "attribution": {
    "project": "LTX 2.3 Video",
    "authors": [
      "Lightricks"
    ],
    "homepage": "https://github.com/sawfwair/mere-run/blob/01feae347b640f1c9fa8bf8e7dfbf782497d2706/docs/model-sources.md",
    "license": {
      "spdx": "LicenseRef-LTX",
      "url": "https://github.com/sawfwair/mere-run/blob/01feae347b640f1c9fa8bf8e7dfbf782497d2706/docs/model-sources.md"
    },
    "components": [
      {
        "name": "sawfwair/mere-run",
        "role": "Mac inference runtime",
        "url": "https://github.com/sawfwair/mere-run",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/sawfwair/mere-run"
        }
      },
      {
        "name": "LTX 2.3 Video usage terms",
        "role": "model use",
        "url": "https://github.com/sawfwair/mere-run/blob/01feae347b640f1c9fa8bf8e7dfbf782497d2706/docs/model-sources.md",
        "license": {
          "spdx": "LicenseRef-LTX",
          "url": "https://github.com/sawfwair/mere-run/blob/01feae347b640f1c9fa8bf8e7dfbf782497d2706/docs/model-sources.md"
        },
        "restrictions": [
          "custom terms; review before use"
        ]
      }
    ]
  },
  "resources": {
    "memory_gb": 48,
    "disk_gb": 110
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_video",
      "modality": "video",
      "label": "Text to video",
      "inputs": [
        {
          "name": "prompt",
          "type": "text"
        }
      ],
      "output": "video",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "width",
          "label": "Width",
          "type": "enum",
          "default": 768,
          "group": "basic",
          "help": "Width used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "height",
          "label": "Height",
          "type": "enum",
          "default": 512,
          "group": "basic",
          "help": "Height used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "frames",
          "label": "Frames",
          "type": "enum",
          "default": 33,
          "group": "advanced",
          "help": "Frames used by the upstream model.",
          "options": [
            9,
            17,
            25,
            33,
            49,
            65,
            97
          ]
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    },
    {
      "id": "image_to_video",
      "modality": "video",
      "label": "Image to video",
      "inputs": [
        {
          "name": "image",
          "type": "image"
        },
        {
          "name": "prompt",
          "type": "text"
        }
      ],
      "output": "video",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "width",
          "label": "Width",
          "type": "enum",
          "default": 768,
          "group": "basic",
          "help": "Width used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "height",
          "label": "Height",
          "type": "enum",
          "default": 512,
          "group": "basic",
          "help": "Height used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "frames",
          "label": "Frames",
          "type": "enum",
          "default": 33,
          "group": "advanced",
          "help": "Frames used by the upstream model.",
          "options": [
            9,
            17,
            25,
            33,
            49,
            65,
            97
          ]
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/sawfwair/mere-run",
  "commit": "01feae347b640f1c9fa8bf8e7dfbf782497d2706",
  "prepare": [
    "python -m lift_media.prepare recipe --expected 63f1e0c35039b236a6156ea4c5e0aa017d1887bb4fff71ae039173557abab71e"
  ]
}
