      - hunyuan3d-paint-v2-0-turbo/unet/diffusion_pytorch_model.safetensors
      - hunyuan3d-paint-v2-0-turbo/unet/modules.py
      - hunyuan3d-paint-v2-0-turbo/vae/config.json
      - hunyuan3d-paint-v2-0-turbo/vae/diffusion_pytorch_model.bin
resources:
  memory_gb: 16
  disk_gb: 20
stages:
  # tqdm bars ("Diffusion Sampling::  50%|...") give the percentage only: the stage keeps the plain name
  # its [Stage] line gave. [Stage] lines themselves are built into every worker.
  - { pattern: '^[^:|]+:\s*(?P<pct>\d+)%\|' }
  - { pattern: '^\s*(?P<pct>\d+)%\|' }
errors:   # plain messages for known failures (shown instead of the raw error; the log keeps the details)
  - { match: "MPS backend out of memory|out of memory|Failed to allocate", message: "Your Mac ran out of memory for this model. Close other apps, lower Mesh detail, or turn on Shape only, then try again." }
  - { match: "kIOGPUCommandBuffer|GPU watchdog", message: "Your Mac's graphics chip took too long on this image. Close other apps or unplug external displays, then try again." }
  - { match: "GatedRepoError|401 Client Error|403 Client Error|ConnectionError|LocalEntryNotFoundError", message: "Couldn't download the Hunyuan3D weights from Hugging Face. Check your internet connection, then try again." }
  - { match: "ImportError|ModuleNotFoundError", message: "A Hunyuan3D component didn't install correctly. Reinstall Hunyuan3D 2.0 from Models." }
tasks:
  - id: image_to_3d
    modality: 3d
    label: Photo → 3D model
    inputs: [{ name: image, type: image }]
    output: mesh
    entry: "launcher.py (mirrors the README quickstart: shape generation plus texture painting)"
    settings:
      - { key: texture, label: Paint texture, type: bool, default: true, group: basic, help: "Paint colors onto the model. Off gives a gray shape much faster; on adds a few minutes." }
      - { key: octree_resolution, label: Mesh detail, type: enum, options: [256, 384, 512], default: 256, group: basic, help: "256 is fastest and safest on a Mac; 384 and 512 add detail, memory and time." }
      - { key: steps, label: Sampling steps, type: int, default: 50, min: 1, max: 100, group: advanced, help: "More steps can add detail and take longer. The model's own default is 50." }
      - { key: guidance, label: Shape fidelity, type: float, default: 5.0, min: 1.0, max: 20.0, group: advanced, help: "How closely the shape follows the photo. The model's own default is 5." }
    # In launcher order (its [Stage] names): the Queue shows "Stage k of N". Shape only skips the painting stages.
    phases:
      - { match: "^Loading Hunyuan3D 2.0 shape model" }
      - { match: "^Generating the shape" }
      - { match: "^Loading the texture models", when: { texture: true } }
      - { match: "^Painting the texture", when: { texture: true } }
      - { match: "^Saving the GLB file" }
      - { match: "^Writing the OBJ file" }
