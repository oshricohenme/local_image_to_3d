  - repo: tencent/Hunyuan3D-2
    files:
      - hunyuan3d-dit-v2-0/config.yaml
      - hunyuan3d-dit-v2-0/model.fp16.safetensors
      - hunyuan3d-delight-v2-0/model_index.json
      - hunyuan3d-delight-v2-0/feature_extractor/preprocessor_config.json
      - hunyuan3d-delight-v2-0/scheduler/scheduler_config.json
      - hunyuan3d-delight-v2-0/text_encoder/config.json
      - hunyuan3d-delight-v2-0/text_encoder/model.safetensors
      - hunyuan3d-delight-v2-0/tokenizer/merges.txt
      - hunyuan3d-delight-v2-0/tokenizer/special_tokens_map.json
      - hunyuan3d-delight-v2-0/tokenizer/tokenizer_config.json
      - hunyuan3d-delight-v2-0/tokenizer/vocab.json
      - hunyuan3d-delight-v2-0/unet/config.json
      - hunyuan3d-delight-v2-0/unet/diffusion_pytorch_model.safetensors
      - hunyuan3d-delight-v2-0/vae/config.json
      - hunyuan3d-delight-v2-0/vae/diffusion_pytorch_model.safetensors
      - hunyuan3d-paint-v2-0-turbo/model_index.json
      - hunyuan3d-paint-v2-0-turbo/feature_extractor/preprocessor_config.json
      - hunyuan3d-paint-v2-0-turbo/image_encoder/config.json
      - hunyuan3d-paint-v2-0-turbo/image_encoder/model.safetensors
      - hunyuan3d-paint-v2-0-turbo/image_encoder/preprocessor_config.json
      - hunyuan3d-paint-v2-0-turbo/scheduler/scheduler_config.json
      - hunyuan3d-paint-v2-0-turbo/text_encoder/config.json
      - hunyuan3d-paint-v2-0-turbo/text_encoder/pytorch_model.bin
      - hunyuan3d-paint-v2-0-turbo/tokenizer/merges.txt
      - hunyuan3d-paint-v2-0-turbo/tokenizer/special_tokens_map.json
      - hunyuan3d-paint-v2-0-turbo/tokenizer/tokenizer_config.json
      - hunyuan3d-paint-v2-0-turbo/tokenizer/vocab.json
