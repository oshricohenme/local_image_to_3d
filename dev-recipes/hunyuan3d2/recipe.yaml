  project: Hunyuan3D 2.0
  authors: [Tencent Hunyuan3D Team]
  homepage: https://hunyuan3d.github.io/
  repo: https://github.com/Tencent-Hunyuan/Hunyuan3D-2
  paper:
    title: 'Hunyuan3D 2.0: Scaling Diffusion Models for High Resolution Textured 3D Assets Generation'
    url: https://arxiv.org/abs/2501.12202
    bibtex: |
      @article{
          yang2025hunyuan3d2,
          title={Hunyuan3D 2.0: Scaling Diffusion Models for High Resolution Textured 3D Assets Generation},
          author={Tencent Hunyuan3D Team},
          journal={arXiv preprint arXiv:2501.12202},
          year={2025}
      }
  license: { spdx: LicenseRef-Hunyuan3D-2, url: https://github.com/Tencent-Hunyuan/Hunyuan3D-2/blob/f8db63096c8282cb27354314d896feba5ba6ff8a/LICENSE }
  components:
    - { name: Hunyuan3D-2, role: code (shape diffusion + texture painting), url: https://github.com/Tencent-Hunyuan/Hunyuan3D-2,
        license: { spdx: LicenseRef-Hunyuan3D-2, url: https://github.com/Tencent-Hunyuan/Hunyuan3D-2/blob/f8db63096c8282cb27354314d896feba5ba6ff8a/LICENSE },
        restrictions: [Territory excludes the EU, the UK and South Korea, "Products over 1M monthly active users need a separate Tencent license",
                      "Distribution requires the license text and change notices", "Do not use outputs to improve other AI models"] }
    - { name: Hunyuan3D-2, role: model weights (dit-v2-0, delight-v2-0, paint-v2-0-turbo), url: https://huggingface.co/tencent/Hunyuan3D-2,
        license: { spdx: LicenseRef-Hunyuan3D-2, url: https://huggingface.co/tencent/Hunyuan3D-2 },
        restrictions: ["Same community license as the code: check the Hugging Face model card before distributing outputs"] }
