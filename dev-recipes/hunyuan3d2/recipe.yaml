# Tencent's Hunyuan3D-2 (photo → textured 3D) on Apple Silicon. Upstream is CUDA-only on paper, but the
# shipped CPU rasterizer path is complete: the install patches the custom_rasterizer extension to build
# without nvcc and always take that path, and the texture stage's hardcoded 'cuda' devices are moved to
# 'mps' (the paint pipeline's DDIM solver and its index tensors stay on the CPU, as upstream keeps them
# off the execution device anyway). Every patch is an exact-string replacement that asserts its match
# count, so a pin bump that changes upstream files fails loudly during install, not silently at runtime.
schema: 1
id: hunyuan3d2
name: Hunyuan3D 2.0
description: >-
  Tencent's Hunyuan3D 2.0 turns one photo of an object into a 3D model, first sculpting the shape with a
  diffusion transformer and then painting a texture onto it. Runs on your Mac with the texture stage's
  rasterizer on the CPU. Best on a single object on a plain background; needs about 16 GB of memory and
  takes a few minutes per model.
publisher: Tencent (Tencent-Hunyuan), Mac packaging by Lift
license: LicenseRef-Hunyuan3D-2
homepage: https://hunyuan3d.github.io/
repo: https://github.com/Tencent-Hunyuan/Hunyuan3D-2
commit: f8db63096c8282cb27354314d896feba5ba6ff8a
python: "3.11"
platform: { status: supported }
install:
  # torch first: both C++ extensions build against its headers. 2.14.1/0.29.1 is the pair unirig uses.
  - uv pip install torch==2.14.1 torchvision==0.29.1
  # Everything the shape and texture stages import, minus the gradio/onnxrembg serving pieces this recipe never runs.
  - uv pip install "diffusers>=0.35" "transformers>=4.48" accelerate einops omegaconf opencv-python trimesh pymeshlab pygltflib xatlas pybind11 ninja tqdm huggingface_hub safetensors pyyaml scikit-image scipy pillow numpy
  # The Mac patches. Each asserts its match count; bump the pin and any drift shows up here.
  - |
    python - <<'PY'
    import pathlib
    root = pathlib.Path("repo")

    def patch(rel, old, new, count=1):
        p = root / rel
        text = p.read_text()
        found = text.count(old)
        assert found == count, f"{rel}: expected {count} match(es) for {old!r}, found {found}"
        p.write_text(text.replace(old, new))

    kern = "hy3dgen/texgen/custom_rasterizer/lib/custom_rasterizer_kernel"

    # custom_rasterizer: drop the CUDA surface, keep the complete CPU rasterizer path.
    # clang (unlike gcc) rejects `float vt[2] = {px + 0.5, py + 0.5}` as double-to-float narrowing.
    patch(f"{kern}/rasterizer.cpp", "float vt[2] = {px + 0.5, py + 0.5};",
          "float vt[2] = {static_cast<float>(px + 0.5), static_cast<float>(py + 0.5)};")
    patch(f"{kern}/rasterizer.h", "#include <ATen/cuda/CUDAContext.h> // For CUDA context\n", "")
    patch(f"{kern}/rasterizer.h", "__host__ __device__", "", count=3)
    patch(f"{kern}/rasterizer.h",
          "std::vector<torch::Tensor> rasterize_image_gpu(torch::Tensor V, torch::Tensor F, torch::Tensor D,\n"
          "    int width, int height, float occlusion_truncation, int use_depth_prior);\n", "")
    patch(f"{kern}/rasterizer.cpp",
          "rasterize_image_gpu(V, F, D, width, height, occlusion_truncation, use_depth_prior)",
          "rasterize_image_cpu(V, F, D, width, height, occlusion_truncation, use_depth_prior)")
    # render.py lives inside the custom_rasterizer package folder, one level under custom_rasterizer/
    rast = "hy3dgen/texgen/custom_rasterizer/custom_rasterizer/render.py"
    patch(rast,
          "rasterize_image(pos[0], tri, clamp_depth, resolution[1],",
          "rasterize_image(pos[0].cpu(), tri.cpu(), clamp_depth.cpu(), resolution[1],")
    patch(rast,
          "    return findices, barycentric",
          "    return findices.to(pos.device), barycentric.to(pos.device)")
    (root / "hy3dgen/texgen/custom_rasterizer/setup.py").write_text(
        "from setuptools import setup, find_packages\n"
        "from torch.utils.cpp_extension import BuildExtension, CppExtension\n"
        "\n"
        "custom_rasterizer_module = CppExtension('custom_rasterizer_kernel', [\n"
        "    'lib/custom_rasterizer_kernel/rasterizer.cpp',\n"
        "    'lib/custom_rasterizer_kernel/grid_neighbor.cpp',\n"
        "])\n"
        "\n"
        "setup(\n"
        "    packages=find_packages(),\n"
        "    version='0.1',\n"
        "    name='custom_rasterizer',\n"
        "    include_package_data=True,\n"
        "    package_dir={'': '.'},\n"
        "    ext_modules=[custom_rasterizer_module],\n"
        "    cmdclass={'build_ext': BuildExtension}\n"
        ")\n")

    texgen = "hy3dgen/texgen"
    # Texture stage: MPS by default, 1024 renders (the CPU rasterizer at 2048 takes minutes), no torch.cuda call.
    patch(f"{texgen}/pipelines.py", "        self.device = 'cuda'", "        self.device = 'mps'")
    patch(f"{texgen}/pipelines.py", "        self.render_size = 2048", "        self.render_size = 1024")
    patch(f"{texgen}/pipelines.py", "        self.texture_size = 2048", "        self.texture_size = 1024")
    patch(f"{texgen}/pipelines.py",
          "        self.render = MeshRender(\n"
          "            default_resolution=self.config.render_size,\n"
          "            texture_size=self.config.texture_size)",
          "        self.render = MeshRender(\n"
          "            default_resolution=self.config.render_size,\n"
          "            texture_size=self.config.texture_size,\n"
          "            device=self.config.device)")
    patch(f"{texgen}/pipelines.py", "        torch.cuda.empty_cache()", "        pass")

    # hunyuanpaint (the paint pipeline): solver and its index tensors stay on the CPU where upstream's
    # turbo path keeps them anyway; image tensors follow the pipeline's execution device.
    hp = f"{texgen}/hunyuanpaint/pipeline.py"
    patch(hp, "        ).to('cuda')", "        ).to('cpu')")
    patch(hp, '.half().to("cuda")', ".half().to(device)")
    patch(hp, "index = torch.range(29, 0, -bsz, device='cuda').long()",
             "index = torch.range(29, 0, -bsz, device='cpu').long()")
    patch(hp, "self.scheduler.set_timesteps(timesteps=timesteps.cpu(), device='cuda')",
             "self.scheduler.set_timesteps(timesteps=timesteps.cpu(), device=device)")

    # Belt and braces: texgen/pipelines.py now passes device=config.device, but fix the default too.
    patch(f"{texgen}/differentiable_renderer/mesh_render.py",
          "        bake_mode='linear', raster_mode='cr', device='cuda'):",
          "        bake_mode='linear', raster_mode='cr', device='mps'):")
    # differentiable_renderer's darwin link args add -dynamiclib, which clashes with distutils'
    # default -bundle -undefined dynamic_lookup for a Python extension module (clang++ refuses
    # both); -dynamiclib is for plain shared libraries, not loadable .so modules.
    patch(f"{texgen}/differentiable_renderer/setup.py",
          "        link_args = ['-fPIC', '-stdlib=libc++', '-mmacosx-version-min=10.14', '-dynamiclib']",
          "        link_args = ['-fPIC', '-stdlib=libc++', '-mmacosx-version-min=10.14']")
    print("Hunyuan3D-2 Mac patches applied")
    PY
  - uv pip install --no-build-isolation ./repo/hy3dgen/texgen/differentiable_renderer ./repo/hy3dgen/texgen/custom_rasterizer
  # The root setup.py is plain setuptools (the extensions above have their own), so --no-deps is safe.
  - uv pip install --no-deps ./repo
  - cd repo && python -c "from hy3dgen.shapegen.pipelines import Hunyuan3DDiTFlowMatchingPipeline; from hy3dgen.texgen.pipelines import Hunyuan3DPaintPipeline; import custom_rasterizer_kernel; print('hy3dgen imports OK')"
