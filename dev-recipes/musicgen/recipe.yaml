{
  "schema": 2,
  "id": "musicgen",
  "name": "MusicGen Small",
  "publisher": "Meta",
  "license": "CC-BY-NC-4.0",
  "homepage": "https://huggingface.co/facebook/musicgen-small",
  "description": "Generate instrumental music. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "uv pip install ./repo \"transformers<5\" sentencepiece soundfile"
  ],
  "brew": [],
  "metal_toolchain": false,
  "weights": [
    {
      "repo": "facebook/musicgen-small",
      "revision": "4c8334b02c6ec4e8664a91979669a501ec497792",
      "gated": false
    }
  ],
  "attribution": {
    "project": "MusicGen Small",
    "authors": [
      "Meta"
    ],
    "homepage": "https://huggingface.co/facebook/musicgen-small",
    "license": {
      "spdx": "CC-BY-NC-4.0",
      "url": "https://huggingface.co/facebook/musicgen-small"
    },
    "components": [
      {
        "name": "facebook/musicgen-small",
        "role": "model component",
        "url": "https://huggingface.co/facebook/musicgen-small",
        "license": {
          "spdx": "CC-BY-NC-4.0",
          "url": "https://huggingface.co/facebook/musicgen-small"
        },
        "restrictions": [
          "non-commercial"
        ]
      },
      {
        "name": "theashishmaurya/mlx-audiocraft",
        "role": "Mac inference runtime",
        "url": "https://github.com/theashishmaurya/mlx-audiocraft",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/theashishmaurya/mlx-audiocraft"
        }
      },
      {
        "name": "MusicGen Small usage terms",
        "role": "model use",
        "url": "https://huggingface.co/facebook/musicgen-small",
        "license": {
          "spdx": "CC-BY-NC-4.0",
          "url": "https://huggingface.co/facebook/musicgen-small"
        },
        "restrictions": [
          "non-commercial"
        ]
      }
    ]
  },
  "resources": {
    "memory_gb": 12,
    "disk_gb": 25
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_music",
      "modality": "music",
      "label": "Text to music",
      "inputs": [
        {
          "name": "prompt",
          "type": "text"
        }
      ],
      "output": "audio",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "duration",
          "label": "Duration",
          "type": "int",
          "default": 10,
          "group": "basic",
          "help": "Duration used by the upstream model.",
          "min": 1,
          "max": 30
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/theashishmaurya/mlx-audiocraft",
  "commit": "bd969249949729dc907f28522377378d382b1ed1",
  "prepare": [
    "python -m lift_media.prepare recipe --expected 5d7bc71ef1a5fb31b1f4dc69c99eb86e0b583c9ecd1eb45e08d674e405cd4481"
  ]
}
