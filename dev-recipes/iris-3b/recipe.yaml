{
  "schema": 2,
  "id": "iris-3b",
  "name": "Iris 3B",
  "publisher": "Sperid Labs",
  "license": "Apache-2.0",
  "homepage": "https://huggingface.co/speridlabs/iris-3b",
  "description": "Runs with stable-diffusion.cpp Metal. Model-specific Apple GPU parity remains unverified. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "uv pip install huggingface-hub numpy safetensors torch",
    "cmake -S repo -B repo/build -DSD_METAL=ON -DCMAKE_BUILD_TYPE=Release",
    "cmake --build repo/build --config Release -j 4",
    "repo/build/bin/sd-cli --help"
  ],
  "brew": [
    "cmake",
    "ffmpeg"
  ],
  "metal_toolchain": true,
  "weights": [
    {
      "repo": "speridlabs/iris-3b",
      "revision": "adc05b909fb05d4276d26aae5a52b36406b2ef26",
      "gated": false,
      "files": [
        "model.safetensors"
      ]
    },
    {
      "repo": "Qwen/Qwen3-VL-4B-Instruct-GGUF",
      "revision": "1cd86afb9a95c410a6038ab3b40d8b578c892266",
      "gated": false,
      "files": [
        "Qwen3VL-4B-Instruct-Q4_K_M.gguf"
      ]
    }
  ],
  "attribution": {
    "project": "Iris 3B",
    "authors": [
      "Sperid Labs"
    ],
    "homepage": "https://huggingface.co/speridlabs/iris-3b",
    "license": {
      "spdx": "Apache-2.0",
      "url": "https://huggingface.co/speridlabs/iris-3b"
    },
    "components": [
      {
        "name": "speridlabs/iris-3b",
        "role": "model component",
        "url": "https://huggingface.co/speridlabs/iris-3b",
        "license": {
          "spdx": "Apache-2.0",
          "url": "https://huggingface.co/speridlabs/iris-3b"
        },
        "restrictions": []
      },
      {
        "name": "Qwen/Qwen3-VL-4B-Instruct-GGUF",
        "role": "model component",
        "url": "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF",
        "license": {
          "spdx": "Apache-2.0",
          "url": "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF"
        },
        "restrictions": []
      },
      {
        "name": "leejet/stable-diffusion.cpp",
        "role": "Mac inference runtime",
        "url": "https://github.com/leejet/stable-diffusion.cpp",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/leejet/stable-diffusion.cpp"
        }
      }
    ]
  },
  "resources": {
    "memory_gb": 24,
    "disk_gb": 60
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_image",
      "modality": "image",
      "label": "Text to image",
      "inputs": [
        {
          "name": "prompt",
          "type": "text"
        }
      ],
      "output": "image",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "width",
          "label": "Width",
          "type": "enum",
          "default": 1024,
          "group": "basic",
          "help": "Width used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "height",
          "label": "Height",
          "type": "enum",
          "default": 1024,
          "group": "basic",
          "help": "Height used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "steps",
          "label": "Steps",
          "type": "int",
          "default": 30,
          "group": "advanced",
          "help": "Steps used by the upstream model.",
          "min": 1,
          "max": 100
        },
        {
          "key": "guidance",
          "label": "Guidance",
          "type": "float",
          "default": 3.0,
          "group": "advanced",
          "help": "Guidance used by the upstream model.",
          "min": 1,
          "max": 20
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/leejet/stable-diffusion.cpp",
  "commit": "1d0a58a35050d285b1d6fb1bc68a92924d35825e",
  "prepare": [
    "python -m lift_media.prepare recipe --expected 77e2de3eb40d7d5dfc3de19565528636d0a78404ff04ae8fd66c7d316c9847a0"
  ]
}
