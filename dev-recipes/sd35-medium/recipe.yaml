{
  "schema": 2,
  "id": "sd35-medium",
  "name": "Stable Diffusion 3.5 Medium",
  "publisher": "Stability AI",
  "license": "LicenseRef-Stability-Community",
  "homepage": "https://huggingface.co/stabilityai/stable-diffusion-3.5-medium",
  "description": "Runs with stable-diffusion.cpp Metal. Model-specific Apple GPU parity remains unverified. Experimental Lift integration: installation and inference have not been validated on hardware.",
  "python": "3.12",
  "platform": {
    "status": "supported"
  },
  "install": [
    "uv pip install -e \"$LIFT_SHARED_DIR/media\"",
    "uv pip install huggingface-hub numpy safetensors torch",
    "cmake -S repo -B repo/build -DSD_METAL=ON -DCMAKE_BUILD_TYPE=Release",
    "cmake --build repo/build --config Release -j 4",
    "repo/build/bin/sd-cli --help"
  ],
  "brew": [
    "cmake",
    "ffmpeg"
  ],
  "metal_toolchain": true,
  "weights": [
    {
      "repo": "stabilityai/stable-diffusion-3.5-medium",
      "revision": "b940f670f0eda2d07fbb75229e779da1ad11eb80",
      "gated": true,
      "files": [
        "sd3.5_medium.safetensors",
        "text_encoders/clip_g.safetensors",
        "text_encoders/clip_l.safetensors",
        "text_encoders/t5xxl_fp16.safetensors"
      ]
    }
  ],
  "attribution": {
    "project": "Stable Diffusion 3.5 Medium",
    "authors": [
      "Stability AI"
    ],
    "homepage": "https://huggingface.co/stabilityai/stable-diffusion-3.5-medium",
    "license": {
      "spdx": "LicenseRef-Stability-Community",
      "url": "https://huggingface.co/stabilityai/stable-diffusion-3.5-medium"
    },
    "components": [
      {
        "name": "stabilityai/stable-diffusion-3.5-medium",
        "role": "model component",
        "url": "https://huggingface.co/stabilityai/stable-diffusion-3.5-medium",
        "license": {
          "spdx": "NOASSERTION",
          "url": "https://huggingface.co/stabilityai/stable-diffusion-3.5-medium"
        },
        "restrictions": [
          "review model card terms"
        ]
      },
      {
        "name": "leejet/stable-diffusion.cpp",
        "role": "Mac inference runtime",
        "url": "https://github.com/leejet/stable-diffusion.cpp",
        "license": {
          "spdx": "MIT",
          "url": "https://github.com/leejet/stable-diffusion.cpp"
        }
      },
      {
        "name": "Stable Diffusion 3.5 Medium usage terms",
        "role": "model use",
        "url": "https://huggingface.co/stabilityai/stable-diffusion-3.5-medium",
        "license": {
          "spdx": "LicenseRef-Stability-Community",
          "url": "https://huggingface.co/stabilityai/stable-diffusion-3.5-medium"
        },
        "restrictions": [
          "custom terms; review before use"
        ]
      }
    ]
  },
  "resources": {
    "memory_gb": 32,
    "disk_gb": 60
  },
  "stages": [
    {
      "pattern": "^\\[Stage\\] (?P<name>.+)$"
    },
    {
      "pattern": "(?P<pct>\\d+)%\\|"
    }
  ],
  "errors": [
    {
      "match": "GatedRepoError|401 Client Error|403 Client Error",
      "message": "Accept the model terms on Hugging Face and add a token with access in Lift."
    },
    {
      "match": "out of memory|Insufficient Memory|Insufficient memory",
      "message": "This generation exceeded available memory. Try a smaller output or fewer frames."
    },
    {
      "match": "Model preparation is missing|Model setup changed|Installed model file is missing|LocalEntryNotFoundError",
      "message": "Model assets are incomplete. Reinstall this model from Models."
    }
  ],
  "tasks": [
    {
      "id": "text_to_image",
      "modality": "image",
      "label": "Text to image",
      "inputs": [
        {
          "name": "prompt",
          "type": "text"
        }
      ],
      "output": "image",
      "entry": "launcher:run",
      "settings": [
        {
          "key": "width",
          "label": "Width",
          "type": "enum",
          "default": 1024,
          "group": "basic",
          "help": "Width used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "height",
          "label": "Height",
          "type": "enum",
          "default": 1024,
          "group": "basic",
          "help": "Height used by the upstream model.",
          "options": [
            256,
            384,
            480,
            512,
            640,
            720,
            768,
            832,
            1024,
            1280,
            2048
          ]
        },
        {
          "key": "steps",
          "label": "Steps",
          "type": "int",
          "default": 28,
          "group": "advanced",
          "help": "Steps used by the upstream model.",
          "min": 1,
          "max": 100
        },
        {
          "key": "guidance",
          "label": "Guidance",
          "type": "float",
          "default": 4.5,
          "group": "advanced",
          "help": "Guidance used by the upstream model.",
          "min": 1,
          "max": 20
        },
        {
          "key": "seed",
          "label": "Seed",
          "type": "int",
          "default": 42,
          "group": "advanced",
          "help": "Seed used by the upstream model.",
          "min": 0,
          "max": 2147483647
        }
      ],
      "phases": [
        {
          "name": "Generating",
          "match": "Generating"
        },
        {
          "name": "Complete",
          "match": "Complete"
        }
      ]
    }
  ],
  "repo": "https://github.com/leejet/stable-diffusion.cpp",
  "commit": "1d0a58a35050d285b1d6fb1bc68a92924d35825e",
  "prepare": [
    "python -m lift_media.prepare recipe --expected f80f51ef0273c7215dc0fa18606a93848fe49c90b5a4a990f00069d3974544c6"
  ]
}
