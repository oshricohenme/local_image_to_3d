# UniRig (VAST-AI-Research) through lift_shim. Install steps: docs/superpowers/findings/2026-10-go-no-go.md.
schema: 1
id: unirig
name: UniRig
description: >-
  Adds a skeleton and skinning to a 3D model so it can be posed and animated. Works on characters, animals
  and objects; the result is a rigged GLB or FBX. Best on clean, single meshes.
publisher: VAST-AI-Research
license: MIT
homepage: https://github.com/VAST-AI-Research/UniRig
repo: https://github.com/VAST-AI-Research/UniRig
commit: 6793c6640ff01c8fb389f3993434124bb43d2933
python: "3.11"
platform: { status: supported }
shim: { patches: [transformers_fa2_to_sdpa] }   # transformers 4.51 raises on flash_attention_2 without CUDA
brew: [libusb]   # open3d (merge step) links /opt/homebrew/opt/libusb/lib/libusb-1.0.0.dylib
install:
  - uv pip install torch==2.14.1 torchvision==0.29.1
  # flash_attn → lift_shim stand-in; wandb is training-only.
  - grep -v -E '^(flash_attn|wandb)' repo/requirements.txt > requirements-mac.txt && uv pip install -r requirements-mac.txt
  # pip: upstream's extract.sh runs `pip install psutil`, which must find this venv's pip (not another Python's).
  # huggingface_hub (also in requirements.txt) provides `hf` for Lift's weight download.
  - uv pip install setuptools wheel pip psutil huggingface_hub
  - uv pip install --no-build-isolation torch_scatter==2.1.2 torch_cluster==1.6.3
  - uv pip install numpy==1.26.4
  - python -c "import bpy, open3d, torch_scatter, torch_cluster"
substitutes: [flash_attn, spconv, torch_scatter, torch_cluster]
attribution:   # spec §4a; facts from the README and LICENSE at the pin and the Hugging Face cards
  project: UniRig
  authors: [Jia-Peng Zhang, Cheng-Feng Pu, Meng-Hao Guo, Yan-Pei Cao, Shi-Min Hu, Tsinghua University, VAST-AI-Research (Tripo)]
  homepage: https://zjp-shadow.github.io/works/UniRig/
  repo: https://github.com/VAST-AI-Research/UniRig
  paper:
    title: "One Model to Rig Them All: Diverse Skeleton Rigging with UniRig (SIGGRAPH 2025, ACM TOG 44(4))"
    url: https://arxiv.org/abs/2504.12451
    bibtex: |
      @article{10.1145/3730930,
      author = {Zhang, Jia-Peng and Pu, Cheng-Feng and Guo, Meng-Hao and Cao, Yan-Pei and Hu, Shi-Min},
      title = {One Model to Rig Them All: Diverse Skeleton Rigging with UniRig},
      year = {2025},
      publisher = {Association for Computing Machinery},
      volume = {44},
      number = {4},
      url = {https://doi.org/10.1145/3730930},
      doi = {10.1145/3730930},
      journal = {ACM Trans. Graph.},
      articleno = {123}
      }
  license: { spdx: MIT, url: https://github.com/VAST-AI-Research/UniRig/blob/6793c6640ff01c8fb389f3993434124bb43d2933/LICENSE }
  components:
    - { name: UniRig weights, role: model weights, url: https://huggingface.co/VAST-AI/UniRig, license: { spdx: MIT, url: https://huggingface.co/VAST-AI/UniRig } }
    - { name: OPT-350m by Meta, role: model architecture config (config.json only), url: https://huggingface.co/facebook/opt-350m, license: { spdx: NOASSERTION, url: https://huggingface.co/facebook/opt-350m } }
    - { name: Blender (bpy), role: mesh import and export, url: https://www.blender.org, license: { spdx: GPL-2.0-or-later, url: https://www.blender.org/about/license/ } }
    - { name: Open3D, role: library, url: https://github.com/isl-org/Open3D, license: { spdx: MIT, url: https://github.com/isl-org/Open3D/blob/main/LICENSE } }
    - { name: PyTorch Scatter and PyTorch Cluster, role: library, url: https://github.com/rusty1s/pytorch_scatter, license: { spdx: MIT, url: https://github.com/rusty1s/pytorch_scatter/blob/master/LICENSE } }
    - { name: libusb, role: system library (Homebrew), url: https://libusb.info, license: { spdx: LGPL-2.1-or-later, url: https://github.com/libusb/libusb/blob/master/COPYING } }
weights:
  - { repo: VAST-AI/UniRig, files: [skeleton/articulation-xl_quantization_256/model.ckpt, skin/articulation-xl/model.ckpt] }   # what src/inference/download.py fetches for these task configs (5.8 of 11.5 GB)
  - { repo: facebook/opt-350m, files: [config.json] }   # the skeleton model's architecture config, not its 2 GB of weights
resources:
  memory_gb: 8
  disk_gb: 4
stages:
  # Bars give the percentage only: the stage keeps the plain name its [Stage] line gave ("Painting the texture",
  # not "Sampling texture SLat"). [Stage] lines are built into every worker.
  - { pattern: '^[^:|]+:\s*(?P<pct>\d+)%\|' }
  - { pattern: '^\s*(?P<pct>\d+)%\|' }
errors:   # plain messages for known failures (shown instead of the raw error; the log keeps the details)
  - { match: "finished without writing skeleton", message: "UniRig couldn't find a skeleton for this model. Try a cleaner single mesh, or reduce the face count." }
  - { match: "finished without writing skin", message: "UniRig made a skeleton but couldn't compute the skinning. Try the skeleton-only option." }
  - { match: "finished without writing rigged", message: "UniRig couldn't combine the skeleton with your model. The log has the details." }
  - { match: "may only contain letters", message: "One of the advanced text settings has characters UniRig can't take. Use only letters, numbers and . _ / , -" }
  - { match: "libusb|incompatible architecture", message: "A helper library is missing or is the wrong kind for this Mac. Reinstall UniRig from Models." }
tasks:
  - id: rig
    modality: 3d
    label: 3D model → rigged model
    inputs: [{ name: mesh, type: mesh }]
    output: rigged_mesh
    entry: launch/inference/generate_skeleton.sh → generate_skin.sh → merge.sh
    settings:   # Lift's stage choice and output format, then every flag of the three upstream scripts with their defaults
      - { key: stages, label: What to add, type: enum, options: [skeleton, skeleton+skin], default: skeleton+skin, group: basic, help: "skeleton: bones only. skeleton+skin: bones plus how the surface follows them (needed to animate)." }
      - { key: format, label: File type, type: enum, options: [glb, fbx], default: glb, group: basic, help: "GLB works almost everywhere; FBX is common in game engines and animation tools." }
      - { key: seed, label: Variation, type: int, default: 12345, group: basic, help: "Change this number to get a different skeleton for the same model." }
      - { key: faces_target_count, label: Detail for rigging, type: int, default: 50000, min: 1, group: advanced, help: "The model is simplified to about this many faces while rigging. Lower is faster." }
      - { key: skeleton_task, label: Skeleton model config, type: enum, options: [configs/task/quick_inference_skeleton_articulationxl_ar_256.yaml], default: configs/task/quick_inference_skeleton_articulationxl_ar_256.yaml, group: advanced, help: "Upstream's skeleton configuration." }
      - { key: skin_task, label: Skinning model config, type: enum, options: [configs/task/quick_inference_unirig_skin.yaml], default: configs/task/quick_inference_unirig_skin.yaml, group: advanced, help: "Upstream's skinning configuration." }
      - { key: add_root, label: Add a root bone, type: bool, default: false, group: advanced, help: "Adds one extra bone at the base that holds the whole skeleton." }
      - { key: config, label: Data config, type: string, default: configs/data/quick_inference.yaml, group: advanced, help: "Upstream's data configuration file." }
      - { key: require_suffix, label: Accepted file types, type: string, default: "obj,fbx,FBX,dae,glb,gltf,vrm", group: advanced, help: "File extensions upstream accepts as input." }
      - { key: num_runs, label: Extraction runs, type: int, default: 1, min: 1, group: advanced, help: "Upstream's number of parallel mesh extractions." }
      - { key: skeleton_force_override, label: Re-read the model (skeleton step), type: bool, default: false, group: advanced, help: "Re-extract the mesh even if a previous extraction exists." }
      - { key: skin_force_override, label: Re-read the model (skinning step), type: bool, default: true, group: advanced, help: "Re-extract the mesh even if a previous extraction exists." }
      - { key: data_name, label: Skinning data file, type: string, default: raw_data.npz, group: advanced, help: "The intermediate file the skinning step reads." }
