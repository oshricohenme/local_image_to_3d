[project]
name = "lift-recipe-tests"
version = "0.1.0"
description = "Weight-free tests for the bundled recipes' launchers: upstream entry points are faked"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "numpy"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
