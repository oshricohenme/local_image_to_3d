[project]
name = "lift-recipe-tests"
version = "0.1.0"
description = "Weight-free tests for the bundled recipes' launchers: upstream entry points are faked"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "numpy"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["../lift_worker/src"]
testpaths = ["../../dev-recipes/pixal3d/test_pixal3d.py", "../../dev-recipes/unirig/test_unirig.py", "../../dev-recipes/trellis2-mac/test_trellis2_mac.py", "../../dev-recipes/hunyuan3d2/test_hunyuan3d2.py"]
